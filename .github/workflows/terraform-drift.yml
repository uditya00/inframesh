name: terraform-drift

'on':
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    env:
      TFSTATE_DB_PASSWORD: ${{ secrets.TFSTATE_DB_PASSWORD }}
      DOCKER_HOST: npipe:////.//pipe//docker_engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local infrastructure
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TFSTATE_DB_PASSWORD)) {
            Write-Error "TFSTATE_DB_PASSWORD secret is missing."
            exit 1
          }

          docker version
          kubectl get nodes

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        working-directory: envs/dev
        shell: powershell
        run: |
          $env:PG_CONN_STR = "postgres://tfstate:$env:TFSTATE_DB_PASSWORD@127.0.0.1:5432/tfstate?sslmode=disable"
          terraform init -input=false

      - name: Terraform Drift Check
        working-directory: envs/dev
        shell: powershell
        run: |
          $env:PG_CONN_STR = "postgres://tfstate:$env:TFSTATE_DB_PASSWORD@127.0.0.1:5432/tfstate?sslmode=disable"

          terraform plan -input=false -detailed-exitcode
          $code = $LASTEXITCODE

          if ($code -eq 0) {
            Write-Host "NO DRIFT: Infrastructure matches Terraform configuration."
            "## Terraform Drift Check`n`n✅ No drift detected." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          if ($code -eq 2) {
            Write-Host "DRIFT DETECTED: Terraform found changes."
            "## Terraform Drift Check`n`n⚠️ Drift detected." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

          Write-Host "TERRAFORM ERROR: Terraform plan returned exit code $code."
          "## Terraform Drift Check`n`n❌ Terraform error: exit code $code." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code
